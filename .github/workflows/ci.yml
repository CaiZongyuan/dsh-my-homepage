name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install step: the package has no dependencies and needs no build.
      - name: Syntax check
        run: npm run check

      - name: Offline self-test
        run: npm run test:offline
